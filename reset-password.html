<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Nova senha — Gestão de Convidados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin/css/styles.css">
</head>
<body class="auth-page auth-page--reset">
  <main class="auth-simple">
    <section class="auth-box auth-box--reset">
      <span class="auth-seal auth-seal--dark">GC</span>
      <span class="eyebrow">Recuperação de acesso</span>
      <h1>Criar nova senha</h1>
      <p class="auth-copy" id="resetIntro">Defina uma nova senha para voltar a acessar o painel.</p>

      <form id="resetForm" class="form-stack">
        <label>
          <span>Nova senha</span>
          <div class="password-field">
            <input type="password" name="password" id="newPassword" required minlength="8" autocomplete="new-password" placeholder="Mínimo de 8 caracteres">
            <button type="button" class="password-toggle" data-toggle-password="newPassword" aria-label="Mostrar senha">Mostrar</button>
          </div>
        </label>
        <label>
          <span>Confirmar nova senha</span>
          <div class="password-field">
            <input type="password" name="confirm_password" id="confirmPassword" required minlength="8" autocomplete="new-password" placeholder="Repita a senha">
            <button type="button" class="password-toggle" data-toggle-password="confirmPassword" aria-label="Mostrar senha">Mostrar</button>
          </div>
        </label>
        <button class="btn btn--primary btn--block" id="resetButton" type="submit">Salvar nova senha</button>
        <p class="form-status" id="resetStatus" role="status" aria-live="polite"></p>
      </form>

      <a class="auth-login-link" href="./">Voltar para o login</a>
    </section>
  </main>

  <script src="admin/js/config.js"></script>
  <script type="module" src="admin/js/reset-password.js"></script>
</body>
</html>
