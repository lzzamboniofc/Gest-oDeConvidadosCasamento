<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F2ED">
  <meta name="description" content="Convite digital de casamento">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Convite de casamento">
  <meta property="og:description" content="Você é nosso convidado para celebrar este dia com a gente.">
  <meta property="og:image" content="assets/images/hero.jpg">
  <title>Convite de casamento</title>

  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="is-locked">
  <noscript><div class="noscript">Ative o JavaScript para visualizar este convite.</div></noscript>

  <div class="opening" id="opening" aria-label="Abertura do convite">
    <div class="opening__line"></div>
    <div class="opening__content">
      <p class="eyebrow" data-text="opening.eyebrow"></p>
      <div class="opening__monogram" data-text="couple.initials"></div>
      <h1 class="opening__names"><span data-text="couple.firstName"></span><i>&</i><span data-text="couple.secondName"></span></h1>
      <p class="opening__date" data-text="wedding.shortDate"></p>
      <p class="opening__copy" data-text="opening.text"></p>
      <button class="button button--dark" id="openInvitation" type="button" data-text="opening.buttonLabel"></button>
    </div>
    <div class="opening__line"></div>
  </div>

  <header class="hero" id="inicio">
    <img class="hero__image" id="heroImage" src="assets/images/hero.jpg" alt="Foto do casal">
    <div class="hero__overlay"></div>

    <nav class="topbar" aria-label="Navegação principal">
      <a class="topbar__brand" href="#inicio" data-text="couple.initials"></a>
      <div class="topbar__links">
        <a href="#detalhes">Detalhes</a>
        <a href="#galeria">Fotos</a>
        <a href="#rsvp">RSVP</a>
      </div>
    </nav>

    <div class="hero__content">
      <p class="eyebrow hero__eyebrow" data-text="hero.eyebrow"></p>
      <h1 class="hero__names"><span data-text="couple.firstName"></span><i>&</i><span data-text="couple.secondName"></span></h1>
      <div class="hero__rule"></div>
      <p class="hero__date"><span data-text="wedding.longDate"></span> · <span data-text="wedding.city"></span></p>
      <p class="hero__subtitle" data-text="hero.subtitle"></p>
      <a class="button button--light" href="#convite" data-text="hero.buttonLabel"></a>
    </div>

    <a class="hero__scroll" href="#convite" aria-label="Rolar para o convite">↓</a>
  </header>

  <main>
    <section class="section invitation" id="convite">
      <div class="shell invitation__grid">
        <div>
          <p class="eyebrow" data-text="invitation.eyebrow"></p>
          <h2 data-text="invitation.title"></h2>
        </div>
        <div class="invitation__copy">
          <p class="lead" data-text="invitation.text"></p>
          <p class="invitation__note" data-text="invitation.note"></p>
        </div>
      </div>

      <div class="shell countdown-wrap">
        <p>Falta pouco</p>
        <div class="countdown" id="countdown" aria-label="Contagem regressiva para o casamento">
          <div><strong data-count="days">00</strong><span>dias</span></div>
          <div><strong data-count="hours">00</strong><span>horas</span></div>
          <div><strong data-count="minutes">00</strong><span>min</span></div>
          <div><strong data-count="seconds">00</strong><span>seg</span></div>
        </div>
      </div>
    </section>

    <section class="section story" id="historia">
      <div class="shell story__grid">
        <figure class="story__media reveal">
          <img id="storyImage" src="assets/images/story.jpg" alt="Foto do casal" loading="lazy">
          <figcaption data-text="story.caption"></figcaption>
        </figure>
        <div class="story__copy reveal">
          <p class="eyebrow" data-text="story.eyebrow"></p>
          <h2 data-text="story.title"></h2>
          <p class="lead" data-text="story.text"></p>
        </div>
      </div>
    </section>

    <section class="section details" id="detalhes">
      <div class="shell">
        <div class="section-heading">
          <p class="eyebrow">Onde & quando</p>
          <h2>Os detalhes do grande dia</h2>
          <p><span data-text="wedding.weekday"></span> · <span data-text="wedding.shortDate"></span> · <span data-text="wedding.time"></span></p>
        </div>
        <div class="event-grid" id="eventGrid"></div>
        <div class="details__actions">
          <button class="text-button" id="calendarButton" type="button">Adicionar ao calendário <span>↗</span></button>
        </div>
      </div>
    </section>

    <section class="section schedule" id="programacao">
      <div class="shell schedule__grid">
        <div class="schedule__heading">
          <p class="eyebrow" data-text="schedule.eyebrow"></p>
          <h2 data-text="schedule.title"></h2>
          <p data-text="schedule.note"></p>
        </div>
        <div class="timeline" id="timeline"></div>
      </div>
    </section>

    <section class="section gallery" id="galeria">
      <div class="shell">
        <div class="gallery__heading">
          <p class="eyebrow" data-text="gallery.eyebrow"></p>
          <h2 data-text="gallery.title"></h2>
        </div>
        <div class="gallery__grid" id="galleryGrid"></div>
      </div>
    </section>

    <section class="section rsvp" id="rsvp">
      <div class="shell rsvp__grid">
        <div class="rsvp__heading">
          <div class="rsvp__monogram" data-text="couple.initials"></div>
          <p class="eyebrow" data-text="rsvp.eyebrow"></p>
          <h2 data-text="rsvp.title"></h2>
          <p class="lead" data-text="rsvp.text"></p>
          <p class="rsvp__deadline">Confirme até <strong data-text="rsvp.deadline"></strong></p>
        </div>

        <form class="rsvp-form" id="rsvpForm">
          <label>
            <span>Nome completo</span>
            <input type="text" name="nome" autocomplete="name" required placeholder="Seu nome">
          </label>
          <label>
            <span>Você vai?</span>
            <select name="presenca" required>
              <option value="">Selecione</option>
              <option value="Sim, estarei presente">Sim, estarei presente</option>
              <option value="Infelizmente não poderei ir">Infelizmente não poderei ir</option>
            </select>
          </label>
          <label>
            <span>Número de pessoas</span>
            <input type="number" name="convidados" min="1" max="10" value="1" inputmode="numeric">
          </label>
          <label>
            <span>Mensagem para os noivos</span>
            <textarea name="mensagem" rows="3" placeholder="Opcional"></textarea>
          </label>
          <button class="button button--accent" type="submit" data-text="rsvp.buttonLabel"></button>
          <p class="rsvp-form__status" id="rsvpStatus" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="shell footer__inner">
      <div>
        <div class="footer__names"><span data-text="couple.firstName"></span> <i>&</i> <span data-text="couple.secondName"></span></div>
        <p data-text="footer.text"></p>
      </div>
      <p class="footer__date"><span data-text="wedding.longDate"></span><br><span data-text="wedding.city"></span></p>
    </div>
  </footer>

  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Foto ampliada">
    <button class="lightbox__close" id="lightboxClose" type="button" aria-label="Fechar">×</button>
    <img id="lightboxImage" src="" alt="">
    <p id="lightboxCaption"></p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/main.js" defer></script>
</body>
</html>
