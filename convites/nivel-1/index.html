<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F3ED">
  <meta name="description" content="Convite de casamento digital">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Convite de casamento">
  <meta property="og:description" content="Você é nosso convidado para celebrar este dia com a gente.">
  <meta property="og:image" content="assets/images/hero.jpg">
  <title>Convite de casamento</title>

  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="hero" id="inicio">
    <img class="hero__image" id="heroImage" src="assets/images/hero.jpg" alt="Foto do casal">
    <div class="hero__overlay"></div>

    <div class="hero__content">
      <div class="monogram" data-text="couple.initials"></div>
      <p class="eyebrow hero__eyebrow" data-text="hero.eyebrow"></p>
      <h1 class="hero__names">
        <span data-text="couple.firstName"></span>
        <i>&</i>
        <span data-text="couple.secondName"></span>
      </h1>
      <p class="hero__date" data-text="wedding.longDate"></p>
      <p class="hero__city" data-text="wedding.city"></p>
      <a class="button button--light" href="#convite" data-text="hero.buttonLabel"></a>
    </div>
  </header>

  <main>
    <section class="section invitation" id="convite">
      <div class="shell shell--narrow">
        <p class="eyebrow" data-text="invitation.eyebrow"></p>
        <h2 data-text="invitation.title"></h2>
        <p class="lead" data-text="invitation.text"></p>

        <div class="countdown" id="countdown" aria-label="Contagem regressiva para o casamento">
          <div><strong data-count="days">00</strong><span>dias</span></div>
          <div><strong data-count="hours">00</strong><span>horas</span></div>
          <div><strong data-count="minutes">00</strong><span>min</span></div>
          <div><strong data-count="seconds">00</strong><span>seg</span></div>
        </div>
      </div>
    </section>

    <section class="section details" id="detalhes">
      <div class="shell">
        <div class="section-heading">
          <p class="eyebrow">Onde & quando</p>
          <h2>Informações do grande dia</h2>
          <p><span data-text="wedding.weekday"></span> · <span data-text="wedding.shortDate"></span> · <span data-text="wedding.time"></span></p>
        </div>
        <div class="event-grid" id="eventGrid"></div>
      </div>
    </section>

    <section class="section rsvp" id="rsvp">
      <div class="shell shell--narrow">
        <div class="rsvp__card">
          <div class="monogram monogram--dark" data-text="couple.initials"></div>
          <p class="eyebrow" data-text="rsvp.eyebrow"></p>
          <h2 data-text="rsvp.title"></h2>
          <p class="lead" data-text="rsvp.text"></p>
          <button class="button button--accent" id="rsvpButton" type="button" data-text="rsvp.buttonLabel"></button>
          <p class="rsvp__status" id="rsvpStatus" role="status" aria-live="polite"></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="shell">
      <div class="footer__names"><span data-text="couple.firstName"></span> <i>&</i> <span data-text="couple.secondName"></span></div>
      <p data-text="footer.text"></p>
      <p class="footer__date"><span data-text="wedding.longDate"></span> · <span data-text="wedding.city"></span></p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/main.js" defer></script>
</body>
</html>
